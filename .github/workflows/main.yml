
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'JARVIS_Android_Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q JARVIS_Android_Project.zip -d extracted
          echo "Checking extracted project files:"
          find extracted -maxdepth 6 -type f | head -n 100
          echo "ROOT GRADLE FILE:"
          cat extracted/build.gradle.kts
          echo "APP GRADLE FILE:"
          cat extracted/app/build.gradle.kts

      - name: Check Gradle wrapper
        run: |
          GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

      - name: Upload APK
        if: always()
        run: echo "Waiting for Gradle configuration inspection."
