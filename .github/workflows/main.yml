name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'JARVIS_Android_Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q JARVIS_Android_Project.zip -d extracted

      - name: Build APK
        run: |
          GRADLEW=$(find extracted -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
