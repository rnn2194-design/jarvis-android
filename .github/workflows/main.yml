
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'JARVIS_Android_Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q JARVIS_Android_Project.zip -d extracted

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/app/build.gradle.kts")
          s = p.read_text()

          addition = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "android {" not in s:
              raise SystemExit("Android configuration not found")

          s = s.replace("android {", "android {\n" + addition, 1)
          p.write_text(s)
          print("Java and Kotlin targets aligned to 17")
          PY

      - name: Build APK
        run: |
          gradle -p extracted assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
